[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aweconfig"
dynamic = ["version"]
description = "A 0600 shell-env vault plus a tiny editor CLI for the API keys your tools read from the environment"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = "MPL-2.0"
dependencies = []

[project.optional-dependencies]
# ruff is pinned exactly: it gates CI/release, so its verdict must be reproducible
dev = ["pytest", "ruff==0.16.5"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
aweconfig = "aweconfig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "aweconfig.__version__" }
